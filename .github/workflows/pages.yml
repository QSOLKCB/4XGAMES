name: Test and deploy VOIDWARD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidward-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test simulation, modding and save admission
        run: node --test tests/*.test.mjs
      - name: Verify donor provenance and offline inventory
        run: node scripts/check.mjs
      - name: Stage only public game files
        run: node scripts/site.mjs build _site
      - name: Install isolated pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/voidward-browser" --no-save --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/voidward-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Play the packaged game and validate campaign mods
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/voidward-browser/node_modules/playwright
        run: |
          node tests/browser.mjs
          node tests/expansion-browser.mjs
          node tests/workbench-browser.mjs
          node tests/command-browser.mjs
      - name: Preserve browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voidward-browser-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy static game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
